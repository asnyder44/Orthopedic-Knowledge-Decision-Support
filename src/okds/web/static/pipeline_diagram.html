<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knowledge Object Data Pipeline: how it works</title>
<style>
  /* same colors as the portal (UI style 21 · Clinic Blue) */
  :root { --brand: #0b5cad; --brand-soft: #dcebfa; --ink: #12263f; --muted: #4d6179; --line: #d3e0ee;
          --ok: #1f7a4f; --ok-soft: #e4f5ec; --warn: #8a5a00; --warn-soft: #fdf1dc; --warn-line: #e2b866;
          --bad: #b42318; --bg: #e7eff8; --arrow: #8399b1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  .wrap { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 6px; }
  .board { flex: 1 1 auto; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: #fff;
           padding: 8px 10px 4px; display: flex; }
  svg.flow { width: 100%; height: 100%; display: block; }
  svg.flow text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .t-title { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .t-sub { font-size: 12.5px; fill: var(--ink); }
  .t-muted { font-size: 12.5px; fill: var(--muted); }
  .t-lbl { font-size: 11.5px; fill: var(--muted); }
  .job .t-title { fill: #fff; }
  .job .t-sub, .job .t-muted { fill: #dcebfa; }
  .node { cursor: default; outline: none; }
  .node .box { transition: stroke .15s ease, stroke-width .15s ease; }
  .node:hover .box, .node:focus .box { stroke: var(--brand); stroke-width: 2.5; }
  .job:hover .box, .job:focus .box { stroke: var(--ink); }
  .pill:hover rect, .pill:focus rect { stroke: var(--ink); stroke-width: 2; }
  .arrow { fill: none; stroke: var(--arrow); stroke-width: 2; }
  .loop { fill: none; stroke: var(--brand); stroke-width: 2; stroke-dasharray: 6 5; }
  .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
  .loopg:hover .loop, .loopg:focus .loop { stroke-width: 3; }

  .bottom { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 12px; color: var(--muted);
            padding: 0 4px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sw { display: inline-flex; align-items: center; justify-content: center; height: 16px; border-radius: 4px; }
  .sw.job { width: 22px; background: var(--brand); color: #fff; }
  .sw.auto { padding: 0 6px; border-radius: 999px; background: var(--ok); color: #fff; font-size: 10.5px; font-weight: 700; }
  .sw.person { padding: 0 6px; border-radius: 999px; background: var(--warn); color: #fff; }
  .sw.store { width: 22px; background: #fff; border: 1.5px solid var(--line); }
  .sw svg { width: 12px; height: 12px; }
  .where { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 12px; border-radius: 10px;
           background: var(--bg); border: 1px solid var(--line); font-size: 12.5px; }
  .where b { font-weight: 700; }
  .where .grp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .where svg { width: 16px; height: 16px; color: var(--brand); flex: 0 0 auto; }
  .where .sep { color: var(--muted); }
  .svc { padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 12px;
         white-space: nowrap; cursor: default; outline: none; }
  .svc:hover, .svc:focus { border-color: var(--brand); color: var(--brand); }
  .now { padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 600;
         white-space: nowrap; cursor: default; outline: none; }
  .tip { position: fixed; left: 0; top: 0; z-index: 10; max-width: 320px; padding: 6px 10px; border-radius: 7px;
         background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.35; pointer-events: none;
         opacity: 0; transition: opacity .12s ease; box-shadow: 0 4px 14px rgba(18,38,63,.22); }
  .tip.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .tip, .node .box { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
  <svg class="flow" viewBox="0 0 1000 390" role="img" aria-labelledby="dg-title dg-desc">
    <title id="dg-title">Knowledge Object Data Pipeline</title>
    <desc id="dg-desc">Topics and trusted sources go into Job 1 (fetch articles, daily, automatic checks). Articles wait in the
      Article inbox. Job 2 (generate, daily, automatic checks) writes one KO and puts it in the Review queue. An operator
      checks it. Accepted KOs go to the KO Library, which OrthoBot uses. Links in KOs suggest new topics.</desc>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#8399b1"/></marker>

        <path d="M0,0 L10,5 L0,10 z" fill="#0b5cad"/></marker>
      <filter id="sh" x="-10%" y="-15%" width="120%" height="140%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#12263f" flood-opacity=".12"/></filter>
      <!-- icons (24 x 24, drawn with currentColor) -->
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></g></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></g></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></g></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/></g></symbol>
      <symbol id="i-stack" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M6 7h12M8 4h8"/></g></symbol>
      <symbol id="i-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-6.5 8-6.5s7 2 8 6.5"/></g></symbol>
      <symbol id="i-books" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="16" rx="1"/><path d="M16.5 5.5l3.4-1 2 15-3.4 1z"/></g></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H10l-4 4v-4H4z"/></g><g fill="currentColor"><circle cx="8.5" cy="10.5" r="1.2"/><circle cx="12" cy="10.5" r="1.2"/><circle cx="15.5" cy="10.5" r="1.2"/></g></symbol>
    </defs>

    <!-- heading -->
    <text x="12" y="32" style="font-size:21px;font-weight:800;fill:#12263f">Knowledge Object</text>
    <text x="12" y="56" style="font-size:21px;font-weight:800;fill:#12263f">Data Pipeline</text>
    <text x="12" y="79" class="t-muted" style="font-size:13px">Makes KOs every day.</text>
    <text x="12" y="96" class="t-muted" style="font-size:13px">People check every one.</text>

    <!-- arrows (drawn first, under the boxes) -->
    <line class="arrow" x1="369" y1="78" x2="369" y2="126" marker-end="url(#ah)"/>

    <text class="t-lbl" x="762" y="162" text-anchor="middle">articles</text>

    <line class="arrow" x1="893" y1="225" x2="893" y2="286" marker-end="url(#ah)"/>
    <text class="t-lbl" x="903" y="260">draft KO</text>

    <line class="arrow" x1="796" y1="330" x2="728" y2="330" marker-end="url(#ah)"/>
    <text class="t-lbl" x="762" y="321" text-anchor="middle">one by one</text>
    <line class="arrow" x1="534" y1="330" x2="466" y2="330" marker-end="url(#ah)"/>
    <text class="t-lbl" x="500" y="321" text-anchor="middle" style="fill:#1f7a4f;font-weight:700">accepted</text>
    <text class="t-lbl" x="500" y="347" text-anchor="middle" style="fill:#b42318">rejected?</text>
    <text class="t-lbl" x="500" y="359" text-anchor="middle" style="fill:#b42318">not used</text>
    <line class="arrow" x1="272" y1="330" x2="204" y2="330" marker-end="url(#ah)"/>
    <text class="t-lbl" x="238" y="321" text-anchor="middle">only these</text>

    <!-- suggested topics loop: KO Library back to KO Topics -->
    <g class="loopg" tabindex="0" role="img" aria-label="Suggested topics: links in KOs suggest new topics. An operator can add them to the KO Topics list."
       data-tip="Links in KOs point to new topics (proposed concepts). An operator can add them to the KO Topics list.">
      <path class="hit" d="M300,288 V256 H107 V214"/>
      <path class="loop" d="M300,288 V256 H107 V215" marker-end="url(#ahb)"/>
      <text x="204" y="249" text-anchor="middle" style="font-size:12.5px;font-style:italic;font-weight:600;fill:#0b5cad">suggested topics</text>
      <text class="t-lbl" x="204" y="272" text-anchor="middle">an operator adds them</text>
    </g>

    <!-- row 0: inputs -->
    <g class="node" tabindex="0" role="img" aria-label="Trusted sources: Europe PMC and PubMed Central"
       data-tip="Open-access research articles from Europe PMC and PubMed Central.">

      <use href="#i-globe" x="278" y="23" width="22" height="22" style="color:#0b5cad"/>
      <text class="t-title" x="308" y="40">Trusted sources</text>
      <text class="t-muted" x="278" y="63">Europe PMC · PubMed Central</text>
    </g>
    <g class="node" tabindex="0" role="img" aria-label="KO prompt and rules, the same as the Generator page"
       data-tip="Job 2 uses the same KO Generator prompt and KO rules as the Generator page.">
      <rect class="box" x="793" y="14" width="200" height="62" rx="10" fill="#f4f8fc" stroke="#d3e0ee" stroke-width="1.5" filter="url(#sh)"/>
      <use href="#i-doc" x="807" y="23" width="22" height="22" style="color:#0b5cad"/>
      <text class="t-title" x="837" y="40">KO prompt + rules</text>
      <text class="t-muted" x="807" y="63">same as the Generator page</text>
    </g>

    <!-- row 1 -->
    <g class="node" tabindex="0" role="img" aria-label="KO Topics: the topic list"
       data-tip="The KO Topics list. The pipeline looks for topics that have no KO yet.">
      <rect class="box" x="12" y="128" width="190" height="84" rx="10" fill="#fff" stroke="#d3e0ee" stroke-width="1.5" filter="url(#sh)"/>

      <text class="t-title" x="56" y="153">KO Topics</text>

      <text class="t-muted" x="26" y="193">Finds topics with no KO</text>
    </g>

    <g class="node job" tabindex="0" role="img" aria-label="Job 1, fetch articles. Scheduled, once a day."
       data-tip="Runs by itself once a day. Finds new open-access articles, trims them, and saves them.">
      <rect class="box" x="274" y="128" width="190" height="84" rx="10" fill="#0b5cad" stroke="#0b5cad" stroke-width="1.5" filter="url(#sh)"/>
      <use href="#i-clock" x="288" y="137" width="22" height="22" style="color:#fff"/>
      <text class="t-title" x="318" y="153">Job 1 · Fetch</text>
      <text class="t-sub" x="288" y="176">Scheduled · once a day</text>
      <text class="t-muted" x="288" y="193">Finds and trims articles</text>
    </g>
    <g class="node pill" tabindex="0" role="img" aria-label="Automatic checks for articles"
       data-tip="Automatic checks, no person needed: open license only, peer reviewed, not retracted, not fetched before.">
      <rect x="297" y="201" width="144" height="22" rx="11" fill="#1f7a4f" stroke="#fff" stroke-width="1.5"/>
      <text x="369" y="216" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">✓ automatic checks</text>
    </g>

    <g class="node" tabindex="0" role="img" aria-label="Article inbox: one Markdown file per article"
       data-tip="One Markdown file per article. Status: new, used, or skipped (with a reason).">

      <use href="#i-inbox" x="550" y="137" width="22" height="22" style="color:#0b5cad"/>
      <text class="t-title" x="580" y="153">Article inbox</text>
      <text class="t-sub" x="550" y="176">One Markdown file each</text>
      <text class="t-muted" x="550" y="193"><tspan style="fill:#0b5cad;font-weight:600">new</tspan> · used · <tspan style="fill:#b42318">skipped</tspan></text>
    </g>

    <g class="node job" tabindex="0" role="img" aria-label="Job 2, generate a KO. Scheduled, once a day."
       data-tip="Runs by itself once a day. Picks a topic with 2 or more new articles and writes ONE KO from them.">
      <rect class="box" x="798" y="128" width="190" height="84" rx="10" fill="#0b5cad" stroke="#0b5cad" stroke-width="1.5" filter="url(#sh)"/>
      <use href="#i-clock" x="812" y="137" width="22" height="22" style="color:#fff"/>
      <text class="t-title" x="842" y="153">Job 2 · Generate</text>
      <text class="t-sub" x="812" y="176">Scheduled · once a day</text>
      <text class="t-muted" x="812" y="193">1 KO per day (can change)</text>
    </g>
    <g class="node pill" tabindex="0" role="img" aria-label="Automatic KO checks"
       data-tip="The KO checker, no person needed: right format, every fact has a source, links point to known topics.">
      <rect x="810" y="201" width="166" height="22" rx="11" fill="#1f7a4f" stroke="#fff" stroke-width="1.5"/>
      <text x="893" y="216" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">✓ automatic KO checks</text>
    </g>

    <!-- row 2 (reads right to left) -->
    <g class="node" tabindex="0" role="img" aria-label="Review queue: drafts wait here, status pending review"
       data-tip="Drafts wait here with status 'pending review'. OrthoBot never reads from the queue.">
      <rect class="box" x="798" y="288" width="190" height="84" rx="10" fill="#fff" stroke="#d3e0ee" stroke-width="1.5" filter="url(#sh)"/>
      <use href="#i-stack" x="812" y="297" width="22" height="22" style="color:#0b5cad"/>
      <text class="t-title" x="842" y="313">Review queue</text>
      <text class="t-sub" x="812" y="336">Drafts wait here</text>
      <g class="chip" data-fill="#fdf1dc" data-color="#8a5a00"><rect x="811" y="341" height="18" rx="9"/><text x="818" y="354" style="font-size:11.5px;font-weight:700">pending review</text></g>
    </g>

    <g class="node" tabindex="0" role="img" aria-label="Operator review, a people check: accept, edit, or reject"

      <use href="#i-books" x="288" y="297" width="22" height="22" style="color:#0b5cad"/>

    </g>

      <span class="lg"><span class="sw person"><svg viewBox="0 0 24 24"><use href="#i-person"/></svg></span>People check</span>
      <span class="lg"><span class="sw store"></span>Saved list or files</span>

    </div>

      <span class="sep">·</span>

        <b>Later:</b>
        <span class="svc" tabindex="0" data-tip="AWS Lambda runs the two jobs in the cloud.">AWS Lambda</span>+
        <span class="svc" tabindex="0" data-tip="EventBridge Scheduler is the daily timer that starts the jobs.">EventBridge</span>+
        <span class="svc" tabindex="0" data-tip="S3 stores the articles and the KOs.">S3</span>+
        <span class="svc" tabindex="0" data-tip="Secrets Manager keeps the AI key safe.">Secrets Manager</span></span>
    </div>
  </div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
(function () {
  const svg = document.querySelector("svg.flow");

  // Size the small status chips to fit their words.
  svg.querySelectorAll("g.chip").forEach(g => {
    const r = g.querySelector("rect"), t = g.querySelector("text");
    r.setAttribute("fill", g.getAttribute("data-fill")); t.setAttribute("fill", g.getAttribute("data-color"));
    r.setAttribute("width", Math.ceil(t.getComputedTextLength() + 14));
  });

  // Safety net: if a line is too long for its box (other fonts), squeeze it a little.
  svg.querySelectorAll("g.node").forEach(g => {
    const box = g.querySelector("rect");
    if (!box) return;
    const right = +box.getAttribute("x") + +box.getAttribute("width") - 8;
    g.querySelectorAll(":scope > text").forEach(t => {
      if (t.getAttribute("text-anchor") === "middle") return;
      const room = right - +t.getAttribute("x");
      if (t.getComputedTextLength() > room) { t.setAttribute("textLength", room); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
    });
  });

  // One-line tooltips on hover (mouse) and on focus (keyboard).
  const tip = document.getElementById("tip");
  let current = null;
  function place(x, y) {
    const w = tip.offsetWidth, h = tip.offsetHeight, W = window.innerWidth, H = window.innerHeight;
    let left = x + 14, top = y + 16;
    if (left + w > W - 6) left = Math.max(6, x - w - 10);
    if (top + h > H - 6) top = Math.max(6, y - h - 12);
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function open(el) {
    if (current === el) return;
    current = el; tip.textContent = el.getAttribute("data-tip"); tip.classList.add("on");
  }
  function close() { current = null; tip.classList.remove("on"); }
  document.addEventListener("mouseover", e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el) { open(el); place(e.clientX, e.clientY); } else close();
  });
  document.addEventListener("mousemove", e => { if (current) place(e.clientX, e.clientY); });
  document.addEventListener("mouseleave", close);
  document.addEventListener("focusin", e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) return;
    open(el); const r = el.getBoundingClientRect(); place(r.left + r.width / 2 - 14, r.bottom - 8);
  });
  document.addEventListener("focusout", close);
})();
</script>
</body>
</html>
